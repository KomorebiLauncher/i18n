name: Merge translations

# Translations live in KomorebiLauncher/i18n-json, which pulls them from the translation platform.
# This writes them into the .ts catalogue and rebuilds the language packs the launcher downloads.
on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only report what would change
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check out the JSON catalogue
        run: git clone --depth 1 https://github.com/KomorebiLauncher/i18n-json.git /tmp/json-source

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Merge
        run: |
          python tools/from_json.py --json /tmp/json-source/json --dir . ${{ inputs.dry_run && '--dry-run' || '' }}
          echo "--- diagnostics ---"
          pwd
          git status --porcelain=v1 | head -10
          git diff --stat | tail -3

      - name: Commit changes
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to merge"
          else
            git commit -m "Merge translations from the JSON catalogue"
            git push
          fi

      - name: Rebuild the language packs
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build.yml --ref master