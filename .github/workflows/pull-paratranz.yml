name: Pull translations from ParaTranz

# Translations are edited on ParaTranz; this brings them back into the .ts files the launcher
# builds its language packs from. Matching is by key (context + sha1 of the source), so a string
# whose source changed is skipped instead of being paired with a translation for other text.
on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only report what would change
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Pull translations
        env:
          PARATRANZ_TOKEN: ${{ secrets.PARATRANZ_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python tools/paratranz.py --token "$PARATRANZ_TOKEN" --dir . --dry-run
          else
            python tools/paratranz.py --token "$PARATRANZ_TOKEN" --dir .
          fi

      - name: Commit changes
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A '*.ts'
          if git diff --cached --quiet; then
            echo "nothing to bring back"
          else
            git commit -m "Pull translations from ParaTranz"
            git push
          fi
