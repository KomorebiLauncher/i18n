name: Build Pages
# Recompiled on every push to master that touches a .ts file, and deploy to gh-pages.

on:
  push:
    branches:
      - master
    paths:
      - '**.ts'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v21

      - name: Build translations
        run: |
          nix develop . -c ./release.sh

      - name: Move directory
        run: |
          mv build _site

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          publish_dir: ./_site
          github_token: ${{ secrets.GITHUB_TOKEN }}
